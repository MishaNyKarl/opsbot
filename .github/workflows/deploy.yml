name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check syntax
        run: npm run check

      - name: Create release archive
        run: |
          mkdir -p "$RUNNER_TEMP/opsbot-release"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='node_modules' \
            -czf "$RUNNER_TEMP/opsbot-release/opsbot.tar.gz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp "$RUNNER_TEMP/opsbot-release/opsbot.tar.gz" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/opsbot.tar.gz"

      - name: Restart bot
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            mkdir -p app app/data
            find app -mindepth 1 -maxdepth 1 ! -name '.env' ! -name 'data' -exec rm -rf {} +
            tar -xzf opsbot.tar.gz -C app
            if [ ! -f app/.env ]; then
              echo 'No app/.env found on server. Create it from .env.production.example before deploying.' >&2
              exit 1
            fi
            cd app
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build
            else
              echo 'Docker Compose is not installed. Install docker-compose-plugin on the server.' >&2
              exit 1
            fi
            docker image prune -f
          "
